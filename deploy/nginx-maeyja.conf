# /etc/nginx/sites-available/maeyja  →  ln -s /etc/nginx/sites-available/maeyja /etc/nginx/sites-enabled/
# Üç host: maeyja.com (+www) → web :3101 · admin.maeyja.com → admin :3100 · api.maeyja.com → API :4100
# Portlar deploy/ports.env ile aynı olmalı. Paylaşımlı sunucu: zone/map adları `mj_` önekli (diğer sitelerle çakışmaz).
# TLS: certbot --nginx -d maeyja.com -d www.maeyja.com -d admin.maeyja.com -d api.maeyja.com
# Sonra http2 ve ssl_* satırlarını certbot'un ürettiği bloklara ekle (aşağıdaki snippet).

# ───────── ortak ─────────
limit_req_zone  $binary_remote_addr zone=mj_api_general:10m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=mj_api_auth:10m    rate=5r/m;
limit_req_zone  $binary_remote_addr zone=mj_admin_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=mj_per_ip:10m;

map $http_upgrade $mj_connection_upgrade { default upgrade; '' close; }

# Kısaltılmış TLS ayarları — her 443 bloğuna `include /etc/nginx/snippets/maeyja-tls.conf;` ile ekle:
#   ssl_protocols TLSv1.2 TLSv1.3;
#   ssl_prefer_server_ciphers off;
#   ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
#   ssl_session_timeout 1d; ssl_session_cache shared:MozSSL:10m; ssl_session_tickets off;
#   ssl_stapling on; ssl_stapling_verify on;
#   add_header Strict-Transport-Security "max-age=300" always;   # ilk hafta; sorun yoksa 63072000; includeSubDomains; preload

# ───────── www → apex ─────────
server {
    listen 80;
    server_name www.maeyja.com;
    return 301 https://maeyja.com$request_uri;
}

# ───────── web (mağaza) ─────────
server {
    listen 80;
    server_name maeyja.com;
    server_tokens off;
    client_max_body_size 2m;
    limit_conn mj_per_ip 40;

    # Uygulama kendi CSP/XFO/Referrer başlıklarını üretir; burada yalnızca HSTS (certbot sonrası) ve nosniff.
    add_header X-Content-Type-Options nosniff always;

    # Token taşıyan bağlantılar access log'a düşmesin
    location ~ ^(/[a-z]{2})?/(account/reset-password|verify-email) {
        access_log off;
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        proxy_pass         http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;   # istemcinin gönderdiği XFF'i ez
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $mj_connection_upgrade;
        proxy_read_timeout 60s;
    }
}

# ───────── admin ─────────
server {
    listen 80;
    server_name admin.maeyja.com;
    server_tokens off;
    client_max_body_size 20m;   # medya yükleme
    limit_conn mj_per_ip 20;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # İsteğe bağlı IP allowlist (ofis / VPN). Açmak için yorumları kaldır:
    # allow 1.2.3.4;
    # deny  all;

    location = /api/auth/admin/login {
        limit_req zone=mj_admin_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;   # istemcinin gönderdiği XFF'i ez
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $mj_connection_upgrade;
        proxy_read_timeout 120s;
    }
}

# ───────── API ─────────
server {
    listen 80;
    server_name api.maeyja.com;
    server_tokens off;
    client_max_body_size 20m;
    limit_conn mj_per_ip 40;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex" always;

    # Yüklenen medya: diskten, MIME zorlamalı, script olarak asla çalışmaz
    location /uploads/ {
        alias /var/www/maeyja/backend/uploads/;
        types { image/webp webp; image/jpeg jpg jpeg; image/png png; image/avif avif; video/mp4 mp4; video/webm webm; }
        default_type application/octet-stream;
        add_header Content-Disposition "inline" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4100/health;
        access_log off;
    }

    # Kimlik uçları: sıkı hız sınırı (uygulama içindeki kilitlemeye ek)
    location ~ ^/api/auth/(login|admin/login|register|forgot-password|reset-password)$ {
        limit_req zone=mj_api_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger prod'da kapalı; açılırsa yalnızca ofis IP'sinden
    location /api/docs {
        # allow 1.2.3.4; deny all;
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
    }

    location / {
        limit_req zone=mj_api_general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass         http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;   # istemcinin gönderdiği XFF'i ez
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
