# /etc/nginx/sites-available/api.maeyja.com  →  ln -s into sites-enabled
# certbot --nginx -d api.maeyja.com adds the TLS block.
server {
    listen 80;
    server_name api.maeyja.com;

    client_max_body_size 20m;

    # Uploaded media straight from disk (the API also serves it, but nginx is faster)
    location /uploads/ {
        alias /var/www/maeyja/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location /health {
        proxy_pass http://127.0.0.1:4000/health;
        access_log off;
    }

    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
