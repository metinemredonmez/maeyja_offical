# /etc/nginx/snippets/maeyja-api-private.conf — api.maeyja.com server bloğuna `include` edilir.
# Yönetim uçları dışarıya kapalı: admin paneli API'ye sunucu içinden (127.0.0.1:4100) gider, nginx'ten geçmez.
# Açık kalanlar: /uploads (ürün görselleri), /api/payments/iyzico/callback (ödeme dönüşü),
# müşteri uçları (ileride mobil uygulama), /health.
location ^~ /api/admin/ { return 404; }
location = /api/auth/admin/login { return 404; }
